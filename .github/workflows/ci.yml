name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifest and scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Validate appmeta/manifest.json
        run: node -e "JSON.parse(require('fs').readFileSync('appmeta/manifest.json', 'utf8'))"

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          test -f scripts/main.js
          while IFS= read -r -d '' file; do
            echo "node --check ${file}"
            node --check "${file}"
          done < <(find scripts -type f -name '*.js' -print0 | sort -z)
